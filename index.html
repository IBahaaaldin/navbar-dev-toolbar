    /* Dark Mode Glass */
    .dark .dev-toolbar {

  <!-- JAVASCRIPT: THEME TOGGLE, BRANCH POPOVER, COPY EMAIL         -->
  <!-- ============================================================ -->
  <script>
    // 1. THEME TOGGLE
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const mobileThemeBtn = document.getElementById('mobileThemeToggle');

    function toggleTheme() {
      htmlEl.classList.toggle('dark');
      localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
    }

    themeBtn?.addEventListener('click', toggleTheme);
    mobileThemeBtn?.addEventListener('click', toggleTheme);

    // 2. INTERACTIVE GIT BRANCH POPOVER
    const branchTriggerBtn = document.getElementById('branchTriggerBtn');
    const branchPopover = document.getElementById('branchPopover');
    const activeBranchLabel = document.getElementById('activeBranchLabel');
    const branchItems = document.querySelectorAll('.branch-item');

    let isBranchOpen = false;

    function openBranchPopover() {
      isBranchOpen = true;
      branchPopover.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      branchPopover.classList.add('opacity-100', 'translate-y-0');
    }

    function closeBranchPopover() {
      isBranchOpen = false;
      branchPopover.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      branchPopover.classList.remove('opacity-100', 'translate-y-0');
    }

    branchTriggerBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isBranchOpen) closeBranchPopover();
      else openBranchPopover();
    });

    branchItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const branchName = item.getAttribute('data-branch');
        activeBranchLabel.textContent = branchName;

        // Update active item styling
        branchItems.forEach(b => {
          b.classList.remove('bg-cyan-500/10', 'text-cyan-600', 'dark:text-cyan-400', 'font-semibold');
          b.classList.add('text-neutral-700', 'dark:text-neutral-300');
          const dot = b.querySelector('.rounded-full');
          if (dot) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-transparent border border-neutral-500';
          }
        });

        item.classList.add('bg-cyan-500/10', 'text-cyan-600', 'dark:text-cyan-400', 'font-semibold');
        item.classList.remove('text-neutral-700', 'dark:text-neutral-300');
        const activeDot = item.querySelector('.rounded-full');
        if (activeDot) {
          activeDot.className = 'w-1.5 h-1.5 rounded-full bg-cyan-400';
        }

        closeBranchPopover();
      });
    });

    document.addEventListener('click', (e) => {
      if (isBranchOpen && !branchPopover.contains(e.target) && e.target !== branchTriggerBtn) {
        closeBranchPopover();
      }
    });

    // 3. COPY EMAIL WITH INTERACTIVE TOOLTIP
    const copyEmailBtn = document.getElementById('copyEmailBtn');
    const copyTooltip = document.getElementById('copyTooltip');
    const copyIcon = document.getElementById('copyIcon');
    const checkIcon = document.getElementById('checkIcon');

    copyEmailBtn?.addEventListener('click', () => {
      navigator.clipboard.writeText('bahaam.coding@gmail.com').catch(() => {});
      
      // Show check icon
      copyIcon?.classList.add('hidden');
      checkIcon?.classList.remove('hidden');

      // Show tooltip
      copyTooltip?.classList.remove('opacity-0', 'pointer-events-none');
      copyTooltip?.classList.add('opacity-100');

      setTimeout(() => {
        copyIcon?.classList.remove('hidden');
        checkIcon?.classList.add('hidden');
        copyTooltip?.classList.add('opacity-0', 'pointer-events-none');
        copyTooltip?.classList.remove('opacity-100');
      }, 1600);
    });

    // 4. MOBILE SLIDE-IN SIDEBAR
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    const mobileSidebar = document.getElementById('mobileSidebar');
    const sidebarLinks = document.querySelectorAll('.sidebar-link');

    function openMobileSidebar() {
      mobileBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      mobileBackdrop.classList.add('opacity-100', 'pointer-events-auto');
      mobileSidebar.classList.remove('translate-x-full');
      mobileSidebar.classList.add('translate-x-0');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileSidebar() {
      mobileBackdrop.classList.add('opacity-0', 'pointer-events-none');
      mobileBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
      mobileSidebar.classList.add('translate-x-full');
      mobileSidebar.classList.remove('translate-x-0');
      document.body.style.overflow = '';
    }

    mobileMenuBtn?.addEventListener('click', openMobileSidebar);
    closeSidebarBtn?.addEventListener('click', closeMobileSidebar);
    mobileBackdrop?.addEventListener('click', closeMobileSidebar);
    sidebarLinks.forEach(link => link.addEventListener('click', closeMobileSidebar));
  </script>
</body>
</html>
